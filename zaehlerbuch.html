<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zählerbuch – App-Einblicke</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:radial-gradient(circle at 50% 0,#161616 0,#090909 52%,#000 100%);color:#fff;line-height:1.6}a{color:#8fd7ff}.page{min-height:100vh;display:flex;flex-direction:column}.wrap{width:min(1180px,94vw);margin:0 auto;padding:32px 18px 0}.hero{display:flex;gap:24px;align-items:center;background:#0d1b2a;border:1px solid #18314d;border-radius:22px;padding:24px}.hero img{width:160px;height:auto;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:22px}.shot{background:#11202b;border:1px solid #185e66;border-radius:18px;overflow:hidden}.shot img{display:block;width:100%;height:auto;image-rendering:auto}.pad{padding:14px}.pad h3{margin:0 0 8px}.pad p{margin:0;color:#aebbc3}.footer{margin-top:auto;padding:24px 16px;text-align:center;font-size:14px}.footer a{color:#9bb4c7;text-decoration:none}.footer span{margin:0 10px;color:#6f7d88}@media(max-width:620px){.hero{flex-direction:column;text-align:center}}</style></head><body><main class="page"><div class="wrap"><a href="/privatkunden.html">← Privatkunden</a><section class="hero"><img src="/zaehlerbuch-logo-hq.webp" alt="Zählerbuch"><div><h1>Zählerbuch</h1><p>Strom · Gas · Wasser · Wärme – Zählerstände, Verbrauch und Kosten einfach im Blick.</p><p><a href="/datenschutz-zaehlerbuch.html">Datenschutz Zählerbuch</a></p></div></section><h2>App-Einblicke</h2><div id="g" class="grid"></div></div><footer class="footer"><a href="/datenschutz.html">Datenschutz</a><span>·</span><a href="/agb.html">AGB</a><span>·</span><a href="/impressum.html">Impressum</a></footer></main><script>const screenshots=[{"src":"1000198770-hq.jpg","title":"Startseite","description":"Übersicht mit Logo, Testphase, Tarifvergleich, Jahresablesung und Suche."},{"src":"1000198772-hq.jpg","title":"Bereiche & Export","description":"Kacheln für Strom, Gas, Wasser und Wärme sowie Export- und Sendeoptionen."},{"src":"1000198778-hq.jpg","title":"Abschlag & Tarifdaten","description":"Eingabe von Verbrauchspreis, Grundpreis, Abschlag, Abrechnungsbeginn und Startzählerstand."},{"src":"1000198776-hq.jpg","title":"Zählerdetail","description":"Detailansicht eines Stromzählers mit Barcode-Scan, Kosten & Abschlag und Zählerfoto."},{"src":"1000198774-hq.jpg","title":"Strom-Zählerliste","description":"Liste der vorhandenen Stromzähler mit aktuellem Zählerstand und direktem Export."},{"src":"1000198780-hq.jpg","title":"Meine Zähler","description":"Übersicht der Zählerarten und Einstieg in Stromspar-Check sowie Gesamtexport."},{"src":"1000198782-hq.jpg","title":"Stromspar-Check 1","description":"Stromsparhinweise mit Checkboxen und sofortiger Kostenschätzung."},{"src":"1000198784-hq.jpg","title":"Stromspar-Check 2","description":"Weitere Stromsparhinweise und die aufsummierte Monats- und Jahresersparnis."},{"src":"1000198789-hq.jpg","title":"PDF-Export","description":"Beispiel einer erzeugten PDF-Verbrauchsübersicht mit Zählerständen und Fotos."},{"src":"1000198786-hq.jpg","title":"Zähler hinzufügen","description":"Dialog zum Anlegen eines neuen Zählers inklusive Barcode-Scan."}];const g=document.getElementById('g');screenshots.forEach((x,i)=>{let c=document.createElement('article');c.className='shot';c.innerHTML=`<img src="/${x.src}" alt="${x.title}"><div class="pad"><h3>${i+1}. ${x.title}</h3><p>${x.description}</p></div>`;g.appendChild(c)});</script></body></html>
