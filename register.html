<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrieren / Anmelden – Real Mobile Workforce</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:radial-gradient(circle at 50% 0,#171717 0,#090909 55%,#000 100%);color:#fff;line-height:1.5}.page{min-height:100vh;display:flex;flex-direction:column}.wrap{width:min(560px,92vw);margin:auto;padding:32px 18px}.logo{display:block;width:min(300px,75vw);margin:0 auto 28px}.card{background:linear-gradient(135deg,#21160c,#151515);border:1px solid #70400d;border-radius:28px;padding:28px;box-shadow:0 12px 32px rgba(0,0,0,.35)}h1{margin:0 0 8px;font-size:clamp(30px,6vw,42px)}p{color:#d7d0c9}label{display:block;margin:15px 0 6px;font-weight:750}input{width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid #444;background:#0d0d0d;color:#fff;font:inherit}button{width:100%;min-height:52px;margin-top:14px;border:0;border-radius:14px;font:inherit;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,#df6500,#ff9d00);color:#fff}.secondary{background:#1a1a1a;border:1px solid #70400d;color:#ffb13b}.msg{min-height:26px;margin-top:14px;color:#ffb13b}.small{font-size:.92rem;color:#aaa}.footer{padding:24px 16px;text-align:center;font-size:14px}.footer a{color:#aaa;text-decoration:none}.footer span{margin:0 10px;color:#555}</style></head><body><main class="page"><div class="wrap"><a href="/"><img class="logo" src="/rmw-logo-hq.webp" alt="Real Mobile Workforce"></a><section class="card"><h1>Registrieren / Anmelden</h1><p>Ab hier geht es nur für registrierte Benutzer weiter.</p><label for="email">E-Mail-Adresse</label><input id="email" type="email" autocomplete="email"><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" minlength="6"><button class="primary" id="login">Anmelden</button><button class="secondary" id="signup">Kostenlos registrieren</button><div id="msg" class="msg"></div><p class="small">Bei der Registrierung kann eine Bestätigung per E-Mail erforderlich sein.</p></section></div><footer class="footer"><a href="/datenschutz.html">Datenschutz</a><span>·</span><a href="/agb.html">AGB</a><span>·</span><a href="/impressum.html">Impressum</a></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth.js"></script><script>const msg=document.getElementById('msg');const email=document.getElementById('email');const password=document.getElementById('password');const params=new URLSearchParams(location.search);const next=params.get('next')||'/privatkunden.html';(async()=>{try{if(await getRmUser())location.replace(next)}catch(e){if(params.get('error'))msg.textContent='Anmeldung konnte nicht geprüft werden. Bitte erneut versuchen.'}})();document.getElementById('login').onclick=async()=>{msg.textContent='Anmeldung läuft …';try{const c=await getRmAuthClient();const{error}=await c.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;location.href=next}catch(e){msg.textContent=e.message||'Anmeldung fehlgeschlagen.'}};document.getElementById('signup').onclick=async()=>{msg.textContent='Registrierung läuft …';try{const c=await getRmAuthClient();const{data,error}=await c.auth.signUp({email:email.value.trim(),password:password.value,options:{emailRedirectTo:location.origin+'/register.html?next='+encodeURIComponent(next)}});if(error)throw error;if(data.session){location.href=next}else{msg.textContent='Registrierung erfolgreich. Bitte bestätige deine E-Mail und melde dich danach an.'}}catch(e){msg.textContent=e.message||'Registrierung fehlgeschlagen.'}}</script></body></html>
