<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passwort zurücksetzen – Real Mobile Workforce</title><style>:root{--ink:#0f1f2f;--muted:#607181;--line:#dce6ec;--soft:#f5f8fa;--soft2:#edf4f7;--brand:#0d6784;--brand2:#1789a8;--accent:#2a9d78;--white:#fff;--shadow:0 18px 50px rgba(18,45,63,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}html,body{margin:0;min-height:100%}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.65}.page{min-height:100vh;display:flex;flex-direction:column}.wrap,.shell{width:min(1080px,92vw);margin:0 auto;padding:0 0 48px}
.topbar{min-height:76px;display:flex;align-items:center;gap:24px;margin-bottom:30px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:900}.brand img{display:block;width:58px;height:46px;object-fit:contain}
.nav{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap;justify-content:flex-end}.nav a,.home{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0;text-decoration:none;font-weight:750;color:#2b4457}.nav a:hover,.nav a.active,.home:hover{color:var(--brand)}
.menu-toggle{display:none;margin-left:auto;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:24px;cursor:pointer}
.footer{margin-top:auto;padding:28px 16px;text-align:center;font-size:14px;color:#66798a;border-top:1px solid var(--line)}.footer a{color:#66798a;text-decoration:none}.footer span{margin:0 10px;color:#a7b4bf}
@media(max-width:700px){.topbar{display:grid;grid-template-columns:1fr auto;gap:10px}.brand img{width:54px;height:44px}.nav{grid-column:1/-1;margin-left:0;gap:8px}.nav a{padding:8px 0}}
.shell{width:min(1050px,92vw)}.wrap{width:min(560px,92vw);margin:28px auto 0;padding:0}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}h1{margin:0 0 8px;font-size:clamp(2rem,6vw,3rem);letter-spacing:-.035em}p{color:var(--muted)}label{display:block;margin:15px 0 6px;font-weight:750}.pw-wrap{position:relative}.pw-wrap input{width:100%;min-height:50px;padding:0 48px 0 14px;border-radius:12px;border:1px solid #cfdce4;background:#fff;color:var(--ink);font:inherit}.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;min-height:40px;margin:0;padding:0;border:0;background:transparent;color:var(--brand);font-size:20px;cursor:pointer;border-radius:10px}.pw-eye:hover{background:var(--soft)}button#save{width:100%;min-height:52px;margin-top:16px;border:0;border-radius:13px;font:inherit;font-weight:850;cursor:pointer;background:var(--brand);color:#fff}.msg{min-height:26px;margin-top:14px;color:var(--brand)}.back{display:block;text-align:center;margin-top:18px;color:var(--brand);text-decoration:none;font-weight:700}</style></head><body><main class="page"><div class="shell"><header class="topbar"><a class="brand" href="/" aria-label="Startseite"><img src="/rmw-logo-hq.webp" alt="Real Mobile Workforce"></a></header><div class="wrap"><section class="card"><h1>Neues Passwort</h1><p>Vergib hier ein neues Passwort für dein RM-Workforce-Konto.</p><label for="pw1">Neues Passwort</label><div class="pw-wrap"><input id="pw1" type="password" minlength="6" autocomplete="new-password"><button class="pw-eye" type="button" data-eye="pw1" aria-label="Passwort anzeigen">👁</button></div><label for="pw2">Passwort wiederholen</label><div class="pw-wrap"><input id="pw2" type="password" minlength="6" autocomplete="new-password"><button class="pw-eye" type="button" data-eye="pw2" aria-label="Passwort anzeigen">👁</button></div><button id="save" type="button">Passwort speichern</button><div id="msg" class="msg">Reset-Link wird geprüft …</div><a class="back" href="/register.html">Zurück zur Anmeldung</a></section></div></div><footer class="footer"><a href="/datenschutz.html">Datenschutz</a><span>·</span><a href="/agb.html">AGB</a><span>·</span><a href="/impressum.html">Impressum</a></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth.js"></script><script>document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye);const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'🙈':'👁';b.setAttribute('aria-label',show?'Passwort verbergen':'Passwort anzeigen')});const msg=document.getElementById('msg');const save=document.getElementById('save');let client;(async()=>{try{client=await getRmAuthClient();const hash=new URLSearchParams(location.hash.slice(1));const access=hash.get('access_token');const refresh=hash.get('refresh_token');if(access&&refresh){const{error}=await client.auth.setSession({access_token:access,refresh_token:refresh});if(error)throw error;history.replaceState({},'',location.pathname)}const{data}=await client.auth.getSession();if(!data.session){msg.textContent='Der Reset-Link ist ungültig oder abgelaufen. Bitte fordere einen neuen an.';save.disabled=true;return}msg.textContent='Reset-Link gültig. Du kannst jetzt dein neues Passwort setzen.'}catch(e){console.error(e);msg.textContent='Der Reset-Link konnte nicht geprüft werden.';save.disabled=true}})();save.onclick=async()=>{const p1=document.getElementById('pw1').value;const p2=document.getElementById('pw2').value;if(p1.length<6){msg.textContent='Das Passwort muss mindestens 6 Zeichen lang sein.';return}if(p1!==p2){msg.textContent='Die beiden Passwörter stimmen nicht überein.';return}save.disabled=true;msg.textContent='Passwort wird gespeichert …';try{const{error}=await client.auth.updateUser({password:p1});if(error)throw error;await client.auth.signOut();msg.textContent='Passwort geändert. Du kannst dich jetzt anmelden.';setTimeout(()=>location.href='/register.html',1200)}catch(e){msg.textContent=e.message||'Passwort konnte nicht geändert werden.';save.disabled=false}}</script></body></html>
