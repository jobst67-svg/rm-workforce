<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passwort zurücksetzen – Real Mobile Workforce</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:radial-gradient(circle at 50% 0,#171717 0,#090909 55%,#000 100%);color:#fff;line-height:1.5}.page{min-height:100vh;display:flex;flex-direction:column}.shell{width:min(1050px,94vw);margin:0 auto;padding:20px 18px 40px}.topbar{display:flex;align-items:center;gap:24px;margin-bottom:28px}.brand img{display:block;width:118px;height:74px;object-fit:contain}.wrap{width:min(560px,92vw);margin:30px auto 0}.card{background:linear-gradient(135deg,#21160c,#151515);border:1px solid #70400d;border-radius:28px;padding:28px;box-shadow:0 12px 32px rgba(0,0,0,.35)}h1{margin:0 0 8px;font-size:clamp(30px,6vw,42px)}p{color:#d7d0c9}label{display:block;margin:15px 0 6px;font-weight:750}input{width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid #444;background:#0d0d0d;color:#fff;font:inherit}button{width:100%;min-height:52px;margin-top:16px;border:0;border-radius:14px;font:inherit;font-weight:850;cursor:pointer;background:linear-gradient(135deg,#df6500,#ff9d00);color:#fff}.msg{min-height:26px;margin-top:14px;color:#ffb13b}.back{display:block;text-align:center;margin-top:18px;color:#ffb13b;text-decoration:none;font-weight:700}.footer{margin-top:auto;padding:24px 16px;text-align:center;font-size:14px;background:#070707}.footer a{color:#aaa;text-decoration:none}.footer span{margin:0 10px;color:#555}@media(max-width:520px){.brand img{width:110px}.wrap{margin-top:10px}}</style></head><body><main class="page"><div class="shell"><header class="topbar"><a class="brand" href="/" aria-label="Startseite"><img src="/rmw-logo-hq.webp" alt="Real Mobile Workforce"></a></header><div class="wrap"><section class="card"><h1>Neues Passwort</h1><p>Vergib hier ein neues Passwort für dein RM-Workforce-Konto.</p><label for="pw1">Neues Passwort</label><input id="pw1" type="password" minlength="6" autocomplete="new-password"><label for="pw2">Passwort wiederholen</label><input id="pw2" type="password" minlength="6" autocomplete="new-password"><button id="save" type="button">Passwort speichern</button><div id="msg" class="msg">Reset-Link wird geprüft …</div><a class="back" href="/register.html">Zurück zur Anmeldung</a></section></div></div><footer class="footer"><a href="/datenschutz.html">Datenschutz</a><span>·</span><a href="/agb.html">AGB</a><span>·</span><a href="/impressum.html">Impressum</a></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth.js"></script><script>const msg=document.getElementById('msg');const save=document.getElementById('save');let client;(async()=>{try{client=await getRmAuthClient();const hash=new URLSearchParams(location.hash.slice(1));const access=hash.get('access_token');const refresh=hash.get('refresh_token');if(access&&refresh){const{error}=await client.auth.setSession({access_token:access,refresh_token:refresh});if(error)throw error;history.replaceState({},'',location.pathname)}const{data}=await client.auth.getSession();if(!data.session){msg.textContent='Der Reset-Link ist ungültig oder abgelaufen. Bitte fordere einen neuen an.';save.disabled=true;return}msg.textContent='Reset-Link gültig. Du kannst jetzt dein neues Passwort setzen.'}catch(e){console.error(e);msg.textContent='Der Reset-Link konnte nicht geprüft werden.';save.disabled=true}})();save.onclick=async()=>{const p1=document.getElementById('pw1').value;const p2=document.getElementById('pw2').value;if(p1.length<6){msg.textContent='Das Passwort muss mindestens 6 Zeichen lang sein.';return}if(p1!==p2){msg.textContent='Die beiden Passwörter stimmen nicht überein.';return}save.disabled=true;msg.textContent='Passwort wird gespeichert …';try{const{error}=await client.auth.updateUser({password:p1});if(error)throw error;await client.auth.signOut();msg.textContent='Passwort geändert. Du kannst dich jetzt anmelden.';setTimeout(()=>location.href='/register.html',1200)}catch(e){msg.textContent=e.message||'Passwort konnte nicht geändert werden.';save.disabled=false}}</script></body></html>
