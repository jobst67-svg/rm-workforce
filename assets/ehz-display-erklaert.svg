<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="t d"><title id="t">eHZ Stromzähler – Display und Bedienelemente</title><desc id="d">Schematische Zeichnung mit sechs nummerierten Pfeilen zu OBIS-Kennzahl, Zählerstand, Phasen, Energierichtung, Impuls-LED und Bedientaste.</desc><defs><linearGradient id="case" x2="0" y2="1"><stop stop-color="#f9fbfc"/><stop offset="1" stop-color="#dce5ea"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#168c66"/></marker></defs><rect width="1100" height="650" rx="25" fill="#f0f6f9"/><text x="45" y="54" font-size="31" font-family="Arial" font-weight="bold" fill="#10334b">Elektronischer Haushaltszähler (eHZ)</text><text x="45" y="85" font-size="19" font-family="Arial" fill="#526979">Schematische Beispielansicht – je nach Hersteller können Anzeigen abweichen</text><rect x="295" y="111" width="510" height="498" rx="29" fill="url(#case)" stroke="#aabdc7" stroke-width="5"/><rect x="334" y="154" width="432" height="256" rx="13" fill="#b7c7bd" stroke="#526c68" stroke-width="8"/><text x="358" y="201" font-size="38" font-family="monospace" fill="#142f2b">1.8.0</text><text x="384" y="296" font-size="69" font-family="monospace" fill="#142f2b">012345</text><text x="680" y="292" font-size="27" font-family="Arial" fill="#142f2b">kWh</text><text x="358" y="365" font-size="26" font-family="Arial" fill="#142f2b">L1  L2  L3</text><text x="550" y="365" font-size="35" font-family="Arial" fill="#142f2b">→</text><text x="629" y="365" font-size="22" font-family="Arial" fill="#142f2b">P 435 W</text><text x="349" y="455" font-size="20" font-family="Arial" fill="#334b59">Zähler-Nr.: 12345678</text><circle cx="404" cy="530" r="12" fill="#e43d3d" stroke="#aa2626" stroke-width="4"/><text x="350" y="570" font-size="17" font-family="Arial" fill="#334b59">1000 Imp/kWh</text><circle cx="603" cy="523" r="38" fill