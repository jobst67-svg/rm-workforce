<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Zweirichtungszähler DZG – Anzeigen erklärt</title><desc id="d">An der Anzeige eines Zweirichtungszählers sind fünf Bereiche mit grünen Pfeilen markiert: Zählerstand, OBIS-Code, Phasen, Energierichtung und Impuls-LED. Die Zählernummer ist neutralisiert.</desc><defs><linearGradient id="c" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e1e6e9"/></linearGradient><linearGradient id="lcd" x2="0" y2="1"><stop stop-color="#d9e6d8"/><stop offset="1" stop-color="#a7bbae"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59bf0b"/></marker></defs><rect width="1200" height="700" fill="#f1f6f9"/><text x="50" y="58" font-family="Arial" font-size="34" font-weight="bold" fill="#073354">eHZ: Display und Anzeigen erklärt</text><rect x="80" y="95" width="1040" height="550" rx="25" fill="url(#c)" stroke="#b4c0c6" stroke-width="4"/><g font-family="Arial" fill="#333"><text x="150" y="155" font-size="42" font-weight="bold">Zweirichtungszähler</text><text x="150" y="193" font-size="28">DWSB20.2TH</text><text x="150" y="227" font-size="22">3x230/400 V　 0,2–5(100) A　 50 Hz</text><text x="150" y="259" font-size="21">Kl. A　 −25 °C … +55 °C　 2025</text><text x="855" y="161" font-size="28">5000 Imp/kWh</text></g><circle cx="1028" cy="204" r="24" fill="#29363c" stroke="#85949a" stroke-width="5"/><circle cx="1028" cy="204" r="11" fill="#f32727"/><rect x="142" y="295" width="916" height="225" rx="13" fill="#4d5e5b"/><rect x="155" y="308" width="890" height="199" rx="7" fill="url(#lcd)"/><g fill="#1e2927" font-family="monospace"><text x="184" y="397" font-size="47">1.8.0</text><text x="390" y="425" font-size="94" font-weight="bold" letter-spacing="1">000000</text><text x="823" y="421" font-size="35">kWh</text><text x="885" y="350" font-size="30">L1 L2 L3</text><text x="920" y="395" font-size="28">+A</text><text x="923" y="468" font-size="38">→</text></g><text x="600" y="562" font-size="28" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#32383b">Eigentum des Messstellenbetreibers</text><rect x="385" y="580" width="430" height="43" rx="6" fill="#d9dfe2"/><text x="600" y="610" font-family="monospace" font-size="30" text-anchor="middle" fill="#32383b">0000 0000 0000</text><g stroke="#59bf0b" stroke-width="8" fill="none" marker-end="url(#a)"><path d="M390 273L440 354"/><path d="M740 274L690 372"/><path d="M900 265L909 330"/><path d="M1090 442L966 457"/><path d="M1092 217L1045 210"/></g><g fill="#59bf0b" stroke="#fff" stroke-width="5"><circle cx="382" cy="265" r="34"/><circle cx="748" cy="265" r="34"/><circle cx="900" cy="257" r="34"/><circle cx="1093" cy="440" r="34"/><circle cx="1093" cy="215" r="34"/></g><g fill="#fff" font-family="Arial" font-size="37" font-weight="bold" text-anchor="middle"><text x="382" y="278">2</text><text x="748" y="278">1</text><text x="900" y="270">3</text><text x="1093" y="453">4</text><text x="1093" y="228">5</text></g><text x="88" y="678" font-size="17" font-family="Arial" fill="#647987">Schematische, an einem DZG-Zweirichtungszähler orientierte Darstellung. Symbole und Funktionen sind modellabhängig.</text></svg>